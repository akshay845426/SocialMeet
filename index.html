                            profileImgOverlay.style.display = 'flex';
                            profileImgOverlay.onclick = () => document.getElementById('profile-file').click();
                        }
                        actionsDiv.innerHTML = "";
                    } else {
                        if (editBtn) editBtn.classList.add('hidden');
                        if (logoutBtn) logoutBtn.classList.add('hidden');
                        const changePhotoBtn = document.getElementById('change-photo-btn');
                        if (changePhotoBtn) changePhotoBtn.classList.add('hidden');
                        if (profileImgOverlay) {
                            profileImgOverlay.style.display = 'none';
                            profileImgOverlay.onclick = null;
                        }

                        const isFollowing = state.following.includes(uid);
                        actionsDiv.innerHTML = `
                            <button class="btn ${isFollowing ? '' : 'btn-primary'} follow-btn-sync" data-uid="${uid}" id="profile-follow-btn" 
                                style="padding: 10px 24px; border-radius: 16px;" onclick="app.toggleFollow('${uid}', '${username}')">
                                ${isFollowing ? 'Following' : 'Follow'}
                            </button>
                            <button class="btn btn-google" style="padding: 10px 24px; border-radius: 16px;" 
                                onclick="app.openPrivateChat('${uid}', '${username}')">
                                <i class="far fa-paper-plane"></i>
                            </button>
                        `;
                    }

                    // Animate Followers/Following
                    const followersCount = userData.followers ? Object.keys(userData.followers).length : 0;
                    const followingCount = userData.following ? Object.keys(userData.following).length : 0;

                    if (statFollowers) utils.animateCount(statFollowers, 0, followersCount, 1000);
                    if (statFollowing) utils.animateCount(statFollowing, 0, followingCount, 1000);
                });

                // Stats and Upload only if Own
                if (isOwn) {
                    const fileInp = document.getElementById('profile-file');
                    const loader = document.getElementById('profile-upload-loader');
                    if (fileInp) {
                        fileInp.onchange = async (e) => {
                            if (!e.target.files[0]) return;
                            if (loader) loader.classList.remove('hidden');
                            try {
                                const b64 = await utils.processImage(e.target.files[0], 500, 0.8);
                                await update(ref(db, `users/${state.user.uid}`), { photo: b64 });
                                await updateProfile(auth.currentUser, { photoURL: b64 });
                            } catch (err) {
                                alert("Error uploading photo: " + err.message);
                            } finally {
                                if (loader) loader.classList.add('hidden');
                            }
                        };
                    }
                }
                app.loadProfilePosts('grid', uid);
            },

            loadProfilePosts: (type, targetUid = null) => {
                const uid = targetUid || state.user.uid;
                const grid = document.getElementById('profile-grid');
                if (!grid) return;
                grid.innerHTML = '<div class="skeleton" style="height:100px; border-radius:12px;"></div>'.repeat(3);
                if (type === 'grid') {
                    onValue(query(ref(db, 'posts'), orderByChild('uid'), equalTo(uid)), snap => {
                        grid.innerHTML = "";
                        const posts = snap.val() ? Object.values(snap.val()).reverse() : [];
                        const statPosts = document.getElementById('stat-posts');
                        if (statPosts) utils.animateCount(statPosts, 0, posts.length, 1000);

                        if (posts.length === 0) {
                            grid.innerHTML = `
                                <div style="grid-column: 1/-1; text-align: center; padding: 40px; opacity: 0.5;">
                                    <i class="fas fa-th" style="font-size: 3rem; margin-bottom: 12px; display: block;"></i>
                                    <p>No posts yet</p>
                                </div>
                            `;
                            return;
                        }
                        posts.forEach(p => grid.innerHTML += `<div class="grid-item"><img src="${p.image}" class="grid-img" onclick="app.navTo('home')"></div>`);
                        if (uid === state.user.uid) {
                            app.updateGlobalAvatars(uid, state.user.photoURL);
                            app.updateGlobalUsernames(uid, state.user.displayName);
                        }
                    }, { onlyOnce: true });
                } else {
                    get(ref(db, `saved/${uid}`)).then(async snap => {
                        grid.innerHTML = "";
                        const ids = snap.val() ? Object.keys(snap.val()) : [];
                        if (ids.length === 0) grid.innerHTML = "<p style='grid-column:1/-1; text-align:center;'>No saved posts.</p>";
                        for (const id of ids) {
                            const p = (await get(ref(db, `posts/${id}`))).val();
                            if (p) grid.innerHTML += `<img src="${p.image}" style="width:100%; height:120px; object-fit:cover; border-radius:12px;" onclick="app.navTo('home')">`;
                        }
                    });
                }
            },

            toggleFollow: async (targetUid, targetName) => {
                const uid = state.user.uid;
                const isFollowing = state.following.includes(targetUid);
                const followRef = ref(db, `following/${uid}/${targetUid}`);
                const followerRef = ref(db, `followers/${targetUid}/${uid}`);

                if (isFollowing) {
                    await set(followRef, null);
                    await set(followerRef, null);
                } else {
                    await set(followRef, true);
                    await set(followerRef, true);
                    push(ref(db, `notifications/${targetUid}`), {
                        type: 'follow', from: uid, fromName: state.user.displayName || "Someone", timestamp: serverTimestamp(), read: false
                    });
                }

                // Sync all visible follow buttons for this user
                const nowFollowing = !isFollowing;
                document.querySelectorAll(`.follow-btn-sync[data-uid="${targetUid}"]`).forEach(btn => {
                    btn.innerText = nowFollowing ? 'Following' : 'Follow';
                    btn.classList.toggle('btn-primary', !nowFollowing);
                });

                // Update follower count if on their profile
                const profileFollowBtn = document.getElementById('profile-follow-btn');
                if (profileFollowBtn && profileFollowBtn.getAttribute('data-uid') === targetUid) {
                    const statFollowers = document.getElementById('stat-followers');
                    if (statFollowers) {
                        let count = parseInt(statFollowers.innerText) || 0;
                        statFollowers.innerText = nowFollowing ? count + 1 : Math.max(0, count - 1);
                    }
                }
            },

            loadChatList: () => {
                const list = document.getElementById('private-chats-list');
                if (!list) return;
                onValue(ref(db, `inbox/${state.user.uid}`), (snap) => {
                    list.innerHTML = "";
                    const data = snap.val();
                    if (!data) {
                        list.innerHTML = "<p style='text-align:center; padding:20px; color:gray;'>No private chats yet.</p>";
                        return;
                    }
                    // Sort by timestamp descending
                    const chats = Object.entries(data).sort((a, b) => b[1].timestamp - a[1].timestamp);
                    chats.forEach(([chatId, info]) => {
                        const div = document.createElement('div');
                        div.className = 'chat-list-item';
                        const photo = info.partnerPhoto || `https://ui-avatars.com/api/?name=${info.partnerName}&background=random`;
                        div.innerHTML = `
                            <img src="${photo}" class="avatar-sync" data-uid="${info.partnerUid}" style="width: 52px; height: 52px; border-radius: 18px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                            <div style="flex:1;">
                                <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 4px;">
                                    <h4 style="margin:0; font-weight: 700; color: var(--text-dark);" class="username-sync" data-uid="${info.partnerUid}">${info.partnerName}</h4>
                                    <span style="font-size:0.7rem; color:var(--text-gray); font-weight: 500;">${utils.timeAgo(info.timestamp)}</span>
                                </div>
                                <div style="font-size:0.85rem; color:var(--text-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;">
                                    ${info.lastMessage || 'No messages'}
                                </div>
                            </div>
                        `;
                        div.onclick = () => app.openChat('private', chatId, info.partnerName);

                        // Long Press Logic for Delete
                        let pressTimer;
                        div.addEventListener('mousedown', () => {
                            pressTimer = window.setTimeout(() => {
                                if (confirm(`Delete conversation with ${info.partnerName} for both sides?`)) {
                                    app.deleteChat(chatId, info.partnerUid);
                                }
                            }, 800);
                        });
                        div.addEventListener('mouseup', () => clearTimeout(pressTimer));
                        div.addEventListener('touchstart', (e) => {
                            pressTimer = window.setTimeout(() => {
                                e.preventDefault();
                                if (confirm(`Delete conversation with ${info.partnerName} for both sides?`)) {
                                    app.deleteChat(chatId, info.partnerUid);
                                }
                            }, 800);
                        }, { passive: false });
                        div.addEventListener('touchend', () => clearTimeout(pressTimer));

                        list.appendChild(div);
                    });
                });
            },

            openPrivateChat: (targetUid, targetName) => {
                const chatId = [state.user.uid, targetUid].sort().join('_');
                app.openChat('private', chatId, targetName);
            },

            deleteChat: async (chatId, partnerUid) => {
                const updates = {};
                updates[`inbox/${state.user.uid}/${chatId}`] = null;
                updates[`inbox/${partnerUid}/${chatId}`] = null;
                updates[`chats/private/${chatId}`] = null;

                try {
                    await update(ref(db), updates);
                    alert("Conversation deleted successfully!");
                } catch (err) {
                    alert("Error deleting chat: " + err.message);
                }
            },

            toggleReaction: async (dbPath, msgId) => {
                const uid = state.user.uid;
                const reactionRef = ref(db, `${dbPath}/${msgId}/reactions/${uid}`);
                const snap = await get(reactionRef);
                if (snap.exists()) {
                    set(reactionRef, null); // Unlike
                } else {
                    set(reactionRef, true); // Like
                    utils.showToast("❤️ reacted!", "success");
                }
            },

            replyTo: (msgId, username, text) => {
                state.replyTo = { msgId, username, text };
                const inp = document.getElementById('chat-input');
                const form = document.getElementById('chat-form');

                let replyPreview = document.getElementById('reply-preview');
                if (!replyPreview) {
                    replyPreview = document.createElement('div');
                    replyPreview.id = 'reply-preview';
                    replyPreview.style = "background: #f1f5f9; padding: 8px 12px; font-size: 0.8rem; border-left: 3px solid var(--primary); margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;";
                    form.insertBefore(replyPreview, inp);
                }

                replyPreview.innerHTML = `
                    <div>
                        <div style="font-weight: 600; color: var(--primary); margin-bottom: 2px;">Replying to ${username}</div>
                        <div style="color: var(--text-gray); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;">${text}</div>
                    </div>
                    <i class="fas fa-times" style="cursor: pointer; padding: 5px; color: var(--text-gray);" onclick="app.cancelReply()"></i>
                `;
                inp.focus();
            },

            cancelReply: () => {
                state.replyTo = null;
                const replyPreview = document.getElementById('reply-preview');
                if (replyPreview) replyPreview.remove();
            },

            openChat: (type, chatId = 'global', title = "Global Chat") => {
                const msgsDiv = document.getElementById('messages-area');
                if (!msgsDiv) {
                    app.navTo('chat');
                    // Need to wait for rendering? Actually better to use viewManager.render directly
                    setTimeout(() => app.openChat(type, chatId, title), 100);
                    return;
                }

                document.getElementById('chat-mode-select').classList.add('hidden');
                document.getElementById('chat-room').classList.remove('hidden');

                const headerName = document.getElementById('chat-room-name');
                headerName.innerText = title;

                // Presence UI in Header
                let statusEl = document.getElementById('chat-partner-status');
                if (!statusEl) {
                    statusEl = document.createElement('div');
                    statusEl.id = 'chat-partner-status';
                    statusEl.style = 'font-size: 0.7rem; color: gray; margin-left: 10px; display: flex; align-items: center;';
                    headerName.parentNode.appendChild(statusEl);
                }
                statusEl.innerHTML = "";

                const dbPath = type === 'global' ? 'chats/global' : `chats/private/${chatId}`;
                const partnerUid = type === 'private' ? chatId.split('_').find(id => id !== state.user.uid) : null;

                // Partner Presence Listener
                if (partnerUid) {
                    onValue(ref(db, `presence/${partnerUid}`), (psnap) => {
                        const p = psnap.val() || {};
                        statusEl.innerHTML = p.online
                            ? `<span style="width:8px; height:8px; background:#4ade80; border-radius:50%; margin-right:5px;"></span> Online`
                            : `Last seen ${utils.timeAgo(p.lastSeen)}`;
                    });
                }

                onValue(query(ref(db, dbPath), limitToLast(50)), (snap) => {
                    msgsDiv.innerHTML = "";
                    const messages = snap.val();
                    if (!messages) {
                        msgsDiv.innerHTML = `
                            <div style="text-align:center; padding: 60px 20px; color: var(--text-gray); opacity:0.5; animation: slideUp 0.6s var(--spring-easing);">
                                <i class="far fa-comments" style="font-size:3.5rem; margin-bottom:16px; display:block;"></i>
                                <p style="font-weight: 500;">No messages yet. Say hi!</p>
                            </div>
                        `;
                        return;
                    }


                    const entries = Object.entries(messages).sort((a, b) => a[1].timestamp - b[1].timestamp);
                    let lastDateStr = null;

                    entries.forEach(([msgId, msg], index) => {
                        // --- Date Separator Logic ---
                        const date = new Date(msg.timestamp);
                        const dateStr = date.toDateString(); // Basic comparison string

                        if (dateStr !== lastDateStr) {
                            const now = new Date();
                            const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
                            let label = "";

                            if (date.toDateString() === now.toDateString()) {
                                label = "Today";
                            } else if (Math.floor((now - new Date(now.toDateString())) / 1000) + Math.floor((new Date(now.toDateString()) - date) / 1000) < 86400 * 2 && date.getDate() !== now.getDate()) {
                                // Simple reliable check for yesterday logic can be tricky, let's keep it simple:
                                // Compare today's midnight with date's midnight
                                const midnightToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                                const midnightDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                                const diffTime = midnightToday - midnightDate;
                                const diffDays = diffTime / (1000 * 60 * 60 * 24);

                                if (diffDays === 1) label = "Yesterday";
                                else label = date.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
                            } else {
                                label = date.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
                            }

                            const sep = document.createElement('div');
                            sep.style.textAlign = "center";
                            sep.style.margin = "20px 0";
                            sep.style.fontSize = "0.75rem";
                            sep.style.color = "var(--text-gray)";
                            sep.style.fontWeight = "500";
                            sep.style.opacity = "0.8";
                            sep.innerHTML = `<span>${label}</span>`;
                            msgsDiv.appendChild(sep);
                            lastDateStr = dateStr;
                        }
                        const isMine = msg.uid === state.user.uid;
                        const isLast = index === entries.length - 1;

                        if (!isMine && type === 'private' && !msg.seen) {
                            update(ref(db, `${dbPath}/${msgId}`), { seen: true, seenAt: serverTimestamp() });
                        }

                        const div = document.createElement('div');
                        div.className = `msg ${isMine ? 'msg-mine' : 'msg-theirs'}`;
                        div.style.animationDelay = `${index * 0.05}s`;

                        const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                        const seenStr = (isMine && isLast && msg.seen) ? `<div style="font-size:0.6rem; text-align:right; opacity:0.6; margin-top:4px; animation: seenFadeIn 0.5s ease;">Seen ${msg.seenAt ? utils.timeAgo(msg.seenAt) : ''} <i class="fas fa-check-double" style="color: var(--primary);"></i></div>` : '';

                        // Reaction Logic
                        const reaction = msg.reactions && msg.reactions[state.user.uid] ? '❤️' : '';
                        const reactionHtml = reaction ? `<div class="reaction-badge" style="position:absolute; bottom:-10px; right:10px; background:white; border-radius:10px; padding:2px 6px; box-shadow:0 2px 5px rgba(0,0,0,0.1); font-size:0.8rem; border:1px solid #f1f5f9;">${reaction}</div>` : '';

                        // Reply Logic
                        const replyBlock = msg.replyTo ? `
                            <div style="background:rgba(0,0,0,0.05); border-left: 3px solid var(--primary); padding: 4px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 0.75rem;">
                                <div style="font-weight: 600; color: var(--primary);">${msg.replyTo.username}</div>
                                <div style="opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${msg.replyTo.text}</div>
                            </div>
                        ` : '';

                        div.innerHTML = `
                            ${type === 'global' ? `<div style="font-size:0.7rem; font-weight: 800; color: ${isMine ? 'rgba(255,255,255,0.8)' : 'var(--primary)'}; margin-bottom: 4px;">${msg.username}</div>` : ''}
                            <div style="line-height: 1.4; position:relative;">
                                ${replyBlock}
                                ${msg.text}
                                ${reactionHtml}
                            </div>
                            <div style="font-size:0.6rem; opacity:0.5; text-align:right; margin-top:4px; font-weight: 500;">${timeStr}</div>
                            ${seenStr}
                        `;

                        // Double tap to react & Swipe Right to Reply
                        let tapTimer;
                        div.addEventListener('touchend', (e) => {
                            const now = new Date().getTime();
                            const lastTap = div.getAttribute('data-last-tap') || 0;
                            if (now - lastTap < 300) {
                                e.preventDefault();
                                app.toggleReaction(dbPath, msgId);
                            }
                            div.setAttribute('data-last-tap', now);
                        });
                        div.addEventListener('dblclick', () => app.toggleReaction(dbPath, msgId));

                        // Swipe Right to Reply (Simple implementation)
                        let startX = 0;
                        div.addEventListener('touchstart', (e) => startX = e.touches[0].clientX);
                        div.addEventListener('touchmove', (e) => {
                            if (e.touches[0].clientX - startX > 50) {
                                div.style.transform = 'translateX(20px)';
                            }
                        });
                        div.addEventListener('touchend', (e) => {
                            if (e.changedTouches[0].clientX - startX > 80) {
                                // Trigger Reply
                                app.replyTo(msgId, msg.username, msg.text);
                                div.style.transform = 'translateX(0)';
                            } else {
                                div.style.transform = 'translateX(0)';
                            }
                        });
                        // Desktop Right Click to Reply
                        div.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            if (confirm(`Reply to ${msg.username}?`)) {
                                app.replyTo(msgId, msg.username, msg.text);
                            }
                        });

                        // Unsend (Delete for everyone) Logic
                        if (isMine) {
                            let pressTimer;
                            const triggerUnsend = async () => {
                                if (confirm("Unsend this message for everyone?")) {
                                    // Delete the message
                                    await set(ref(db, `${dbPath}/${msgId}`), null);

                                    // Update Inbox if it's a private chat
                                    if (type === 'private') {
                                        const snap = await get(query(ref(db, dbPath), limitToLast(1)));
                                        const latest = snap.val();
                                        const partnerUid = chatId.split('_').find(id => id !== state.user.uid);

                                        if (latest) {
                                            const [newId, newMsg] = Object.entries(latest)[0];
                                            const updateData = { lastMessage: newMsg.text, timestamp: newMsg.timestamp };
                                            update(ref(db, `inbox/${state.user.uid}/${chatId}`), updateData);
                                            update(ref(db, `inbox/${partnerUid}/${chatId}`), updateData);
                                        } else {
                                            // No messages left - clear inbox entries
                                            set(ref(db, `inbox/${state.user.uid}/${chatId}`), null);
                                            set(ref(db, `inbox/${partnerUid}/${chatId}`), null);
                                        }
                                    }
                                }
                            };

                            div.addEventListener('mousedown', () => {
                                pressTimer = window.setTimeout(triggerUnsend, 800);
                            });
                            div.addEventListener('mouseup', () => clearTimeout(pressTimer));
                            div.addEventListener('touchstart', (e) => {
                                pressTimer = window.setTimeout(() => {
                                    e.preventDefault();
                                    triggerUnsend();
                                }, 800);
                            }, { passive: false });
                            div.addEventListener('touchend', () => clearTimeout(pressTimer));
                        }

                        msgsDiv.appendChild(div);
                    });
                    msgsDiv.scrollTop = msgsDiv.scrollHeight;
                });
                document.getElementById('chat-form').onsubmit = async (e) => {
                    e.preventDefault();
                    const inp = document.getElementById('chat-input');

                    // --- Typing Indicator Logic ---
                    let typingTimer;
                    inp.addEventListener('input', () => {
                        const partnerUid = chatId.split('_').find(id => id !== state.user.uid);
                        if (type === 'private' && partnerUid) {
                            update(ref(db, `typing/${chatId}/${state.user.uid}`), { isTyping: true });
                            clearTimeout(typingTimer);
                            typingTimer = setTimeout(() => {
                                update(ref(db, `typing/${chatId}/${state.user.uid}`), { isTyping: false });
                            }, 2000);
                        }
                    });

                    // Listen for Partner Typing
                    const partnerUid = chatId.split('_').find(id => id !== state.user.uid);
                    if (type === 'private' && partnerUid) {
                        const typingRef = ref(db, `typing/${chatId}/${partnerUid}`);
                        onValue(typingRef, (snap) => {
                            const data = snap.val();
                            const area = document.getElementById('messages-area');
                            const existingTyping = document.getElementById('typing-indicator');

                            if (data && data.isTyping) {
                                if (!existingTyping) {
                                    const tDiv = document.createElement('div');
                                    tDiv.id = 'typing-indicator';
                                    tDiv.className = 'msg msg-theirs';
                                    tDiv.style.marginBottom = '10px';
                                    tDiv.style.width = 'fit-content';
                                    tDiv.innerHTML = `<span class="dot-flashing"></span> <span style="font-size:0.7rem; margin-left:8px;">Typing...</span>`;
                                    area.appendChild(tDiv);
                                    area.scrollTop = area.scrollHeight;
                                }
                            } else {
                                if (existingTyping) existingTyping.remove();
                            }
                        });
                    }

                    const text = inp.value.trim();
                    if (!text) return;

                    const msgData = {
                        text: text,
                        uid: state.user.uid,
                        username: state.user.displayName || "User",
                        timestamp: serverTimestamp(),
                        seen: false,
                        replyTo: state.replyTo || null
                    };

                    // Send the message
                    await push(ref(db, dbPath), msgData);
                    
                    // Clear Reply State
                    if (state.replyTo) app.cancelReply();

                    // If private, update inbox for both users
                    if (type === 'private') {
                        const partnerUid = chatId.split('_').find(id => id !== state.user.uid);

                        // Fetch latest partner info for accurate inbox entry
                        const partnerSnap = await get(ref(db, `users/${partnerUid}`));
                        const pData = partnerSnap.val() || {};
                        const pName = pData.username || title;
                        const pPhoto = pData.photo || pData.photoURL || `https://ui-avatars.com/api/?name=${pName}&background=random`;

                        // Update My Inbox
                        update(ref(db, `inbox/${state.user.uid}/${chatId}`), {
                            lastMessage: text,
                            timestamp: serverTimestamp(),
                            partnerUid: partnerUid,
                            partnerName: pName,
                            partnerPhoto: pPhoto
                        });

                        // Update Partner's Inbox
                        update(ref(db, `inbox/${partnerUid}/${chatId}`), {
                            lastMessage: text,
                            timestamp: serverTimestamp(),
                            partnerUid: state.user.uid,
                            partnerName: state.user.displayName || "User",
                            partnerPhoto: state.user.photoURL || ""
                        });
                    }

                    inp.value = "";
                };
            },

            closeChat: () => { document.getElementById('chat-room').classList.add('hidden'); document.getElementById('chat-mode-select').classList.remove('hidden'); },

            loadActivity: () => {
                const list = document.getElementById('activity-list');
                onValue(query(ref(db, `notifications/${state.user.uid}`), limitToLast(30)), (snap) => {
                    list.innerHTML = "";
                    if (!snap.val()) { list.innerHTML = "<p style='text-align:center; padding:20px;'>No activity yet.</p>"; return; }
                    Object.entries(snap.val()).sort((a, b) => b[1].timestamp - a[1].timestamp).forEach(([id, n]) => {
                        const div = document.createElement('div');
                        div.style.padding = "15px"; div.style.borderBottom = "1px solid #f1f5f9";
                        div.style.background = n.read ? "white" : "#fffbeb";
                        div.innerHTML = `<div style="font-size:0.9rem;">${n.type === 'like' ? '❤️ Someone liked your post.' : `💬 <b>${n.fromName}</b> commented.`}</div>
                            <div style="font-size:0.75rem; color:gray;">${utils.timeAgo(n.timestamp)}</div>`;
                        list.appendChild(div);
                        if (!n.read) setTimeout(() => update(ref(db, `notifications/${state.user.uid}/${id}`), { read: true }), 3000);
                    });
                });
            }
        };

        // --- PREVIEW FILE HANDLING ---
        window.addEventListener('change', (e) => {
            if (e.target.id === 'file-input' && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = document.getElementById('image-preview');
                    img.src = ev.target.result;
                    img.style.display = 'block';
                    document.getElementById('drop-zone').style.display = 'none';
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // --- INIT ---
        document.getElementById('btn-submit-auth').onclick = app.handleAuth;
        document.getElementById('btn-google-auth').onclick = app.handleGoogleAuth;

        // Export app for HTML access
        window.app = app;
        app.init();

    </script>
</body>

</html>
