<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Social Meet</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => console.log('SW registered')).catch(err => console.log('SW failed', err));
            });
        }
    </script>

    <style>
        :root {
            /* HSL Palette for better harmony */
            --bg-main: hsl(210, 40%, 98%);
            --bg-nav: hsla(0, 0%, 100%, 0.8);
            --primary: hsl(45, 93%, 47%);
            --primary-light: hsl(45, 93%, 90%);
            --accent: hsl(12, 95%, 53%);
            --accent-soft: hsla(12, 95%, 53%, 0.1);
            --text-dark: hsl(222, 47%, 11%);
            --text-gray: hsl(215, 16%, 47%);
            --success: hsl(142, 71%, 45%);

            --soft-shadow: 0 20px 40px -10px hsla(222, 47%, 11%, 0.08);
            --card-radius: 32px;
            --glass-blur: blur(20px);
            --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
            --anim-speed: 0.4s;
        }

        /* --- Dark Mode Variables --- */
        body.dark-mode {
            --bg-main: #0d1117;
            --bg-nav: rgba(22, 27, 34, 0.9);
            --bg-card: #161b22;
            --text-dark: #f0f6fc;
            --text-gray: #8b949e;
            --soft-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            color: var(--text-dark);
        }

        body.dark-mode .story-ring {
            border: 3px solid #21262d;
        }

        body.dark-mode input,
        body.dark-mode textarea {
            background: #21262d !important;
            color: white !important;
            border-color: #30363d !important;
        }

        body.dark-mode .nav-item {
            color: #8b949e;
        }

        body.dark-mode .nav-item.active {
            color: var(--primary);
        }

        body.dark-mode .stats-row {
            background: #161b22;
            border: 1px solid #30363d;
        }

        body.dark-mode .msg-theirs {
            background: #21262d;
            color: white;
        }

        body.dark-mode .search-item {
            border-bottom-color: #30363d;
            background: transparent;
        }

        body.dark-mode .search-item:hover {
            background: #21262d;
        }

        body.dark-mode header,
        body.dark-mode nav {
            border-color: #30363d;
            background: var(--bg-nav);
        }

        /* --- New & Improved Animations --- */
        @keyframes appEntrance {
            from {
                opacity: 0;
                filter: blur(10px);
            }

            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            50% {
                transform: scale(1.05);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes heartPop {
            0% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.4);
            }

            50% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes ripple {
            0% {
                transform: scale(0);
                opacity: 1;
            }

            100% {
                transform: scale(4);
                opacity: 0;
            }
        }

        @keyframes shimmerGradient {
            0% {
                background-position: -468px 0;
            }

            100% {
                background-position: 468px 0;
            }
        }

        @keyframes navPop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: var(--primary);
            color: var(--primary);
            animation: dot-flashing 1s infinite linear alternate;
            display: inline-block;
            margin: 0 4px;
        }

        @keyframes dot-flashing {
            0% {
                background-color: var(--primary);
            }

            50%,
            100% {
                background-color: rgba(79, 70, 229, 0.2);
            }
        }

        @keyframes msgSlideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes seenFadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Common UI Components --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            overflow-x: hidden;
            height: 100vh;
            line-height: 1.5;
            animation: appEntrance 0.6s var(--spring-easing);
        }

        /* --- Common UI Components --- */
        .hidden {
            display: none !important;
        }

        .btn {
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 16px;
            transition: all 0.3s var(--spring-easing);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            left: 0;
            top: 0;
            transform: scale(0);
            opacity: 0;
            transition: 0.4s;
            border-radius: inherit;
        }

        .btn:active::after {
            transform: scale(2);
            opacity: 1;
            transition: 0s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px -5px hsla(45, 93%, 47%, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 15px 30px -10px hsla(45, 93%, 47%, 0.5);
            transform: translateY(-2px);
        }

        .btn-google {
            background: white;
            border: 2px solid hsl(210, 40%, 94%);
            color: var(--text-dark);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* --- Auth Screen --- */
        #auth-view {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, hsl(45, 100%, 96%), hsl(12, 100%, 96%));
            padding: 24px;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: var(--card-radius);
            box-shadow: var(--soft-shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: slideUp 0.8s var(--spring-easing);
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .auth-subtitle {
            color: var(--text-gray);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
            margin-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid hsl(210, 40%, 94%);
            border-radius: 18px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            background: hsl(210, 40%, 99%);
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        /* --- Global Utilities --- */
        #offline-banner {
            display: none;
            background: var(--text-dark);
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: var(--glass-blur);
            animation: slideUp 0.4s var(--spring-easing);
        }

        #ptr-indicator {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
            transform: translateY(-120%);
            transition: transform 0.3s var(--spring-easing);
            color: var(--primary);
            font-size: 1.4rem;
            pointer-events: none;
        }

        #ptr-indicator.pulling {
            transition: none;
        }

        #ptr-indicator.refreshing {
            transform: translateY(0);
        }

        .ptr-icon {
            transition: transform 0.1s linear;
        }

        .refresh-spin {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- App Shell --- */
        #app-view {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        header {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-nav);
            backdrop-filter: var(--glass-blur);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid hsla(210, 40%, 94%, 0.5);
        }

        .brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--primary);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 120px 16px;
            scroll-behavior: smooth;
        }

        /* --- Bottom Navigation --- */
        nav {
            position: fixed;
            bottom: 24px;
            left: 20px;
            right: 20px;
            background: var(--bg-nav);
            backdrop-filter: var(--glass-blur);
            padding: 12px 10px;
            border-radius: 24px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .nav-item {
            color: var(--text-gray);
            font-size: 1.5rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            transition: all 0.3s var(--spring-easing);
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-8px);
            animation: navPop 0.4s var(--spring-easing);
        }

        .nav-upload {
            background: var(--primary);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-25px);
            box-shadow: 0 12px 24px -6px hsla(45, 93%, 47%, 0.4);
            font-size: 1.8rem;
            transition: all 0.3s var(--spring-easing);
        }

        .nav-upload:active {
            transform: translateY(-20px) scale(0.9);
        }

        /* Story Views */
        .story-views-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .views-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .views-card {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 25px;
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .view-user-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-bottom: 1px solid #f1f5f9;
        }

        .view-user-row img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--accent-red);
            color: white;
            font-size: 10px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- Social Meet Extras --- */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-yellow);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .profile-img-container {
            position: relative;
            display: inline-block;
        }

        .profile-img-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        .profile-img-container:hover .profile-img-overlay {
            opacity: 1;
        }

        /* --- Stories Rail --- */
        .stories-container {
            display: flex;
            overflow-x: auto;
            padding: 10px 0 20px 0;
            gap: 16px;
            scrollbar-width: none;
        }

        .story-item {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 76px;
            transition: transform 0.3s var(--spring-easing);
        }

        .story-item:active {
            transform: scale(0.9);
        }

        .story-ring {
            width: 72px;
            height: 72px;
            border-radius: 28px;
            /* Squircle look */
            padding: 3px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            position: relative;
            box-shadow: 0 8px 15px -5px hsla(12, 95%, 53%, 0.3);
        }

        .story-ring img {
            width: 100%;
            height: 100%;
            border-radius: 25px;
            object-fit: cover;
            border: 3px solid white;
        }

        .story-add {
            background: hsl(210, 40%, 94%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }

        .story-add-icon {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: var(--primary);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .story-name {
            font-size: 0.7rem;
            font-weight: 500;
            margin-top: 8px;
            color: var(--text-gray);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Floating Cards --- */
        .card {
            background: white;
            border-radius: var(--card-radius);
            margin-bottom: 32px;
            box-shadow: var(--soft-shadow);
            overflow: hidden;
            position: relative;
            transition: all 0.4s var(--spring-easing);
            animation: slideUp 0.6s var(--spring-easing) backwards;
            border: 1px solid hsla(210, 40%, 94%, 0.5);
            /* Asymmetric curve look */
            border-top-right-radius: 8px;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 30px 60px -12px hsla(222, 47%, 11%, 0.12);
        }

        .card-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-sm {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .username {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .post-time {
            font-size: 0.75rem;
            color: var(--text-gray);
            font-weight: 500;
        }

        .card-image-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #f1f5f9;
        }

        .card-img {
            width: 100%;
            height: auto;
            max-height: 500px;
            display: block;
            object-fit: contain;
            transition: transform 0.6s var(--spring-easing);
        }

        .card:hover .card-img {
            transform: scale(1.02);
        }

        .card-actions {
            padding: 16px 20px;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid hsla(210, 40%, 94%, 0.5);
        }

        .action-btn {
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s var(--spring-easing);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn i {
            transition: transform 0.3s var(--spring-easing);
        }

        .action-btn:active i {
            transform: scale(1.4);
        }

        .action-btn.liked {
            color: var(--accent);
            animation: heartPop 0.4s var(--spring-easing);
        }

        .card-body {
            padding: 16px 20px 24px 20px;
        }

        .likes-count {
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 0.9rem;
            display: block;
        }

        .caption {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-dark);
        }

        /* --- Skeletons --- */
        .skeleton {
            background: #f6f7f8;
            background-image: linear-gradient(to right, #f6f7f8 0%, #edeef1 20%, #f6f7f8 40%, #f6f7f8 100%);
            background-repeat: no-repeat;
            background-size: 800px 104px;
            display: inline-block;
            position: relative;
            animation: shimmerGradient 1.5s infinite linear;
            border-radius: 8px;
        }

        .sk-card {
            width: 100%;
            height: 400px;
            border-radius: var(--card-radius);
            margin-bottom: 24px;
        }

        .sk-avatar {
            width: 44px;
            height: 44px;
            border-radius: 16px;
        }

        .sk-text {
            height: 12px;
            border-radius: 4px;
        }
        }

        .like-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 5rem;
            color: white;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }

        .like-anim {
            animation: heartBurst 0.8s ease-out forwards;
        }

        .card-actions {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
        }

        .action-left {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            font-size: 1.5rem;
            color: var(--text-dark);
            background: none;
            padding: 0;
        }

        .action-btn.liked {
            color: var(--accent-red);
            animation: pop 0.3s;
        }

        .card-content {
            padding: 0 15px 15px 15px;
        }

        .likes-count {
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        .caption {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .hashtags {
            color: var(--primary-yellow);
            font-weight: 500;
        }

        /* --- Upload View --- */
        .upload-zone {
            border: 3px dashed #cbd5e1;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .upload-zone.dragover {
            border-color: var(--primary-yellow);
            background: var(--primary-yellow-light);
        }

        #image-preview {
            width: 100%;
            border-radius: 20px;
            display: none;
            margin-bottom: 15px;
        }

        /* --- Chat UI --- */
        .chat-list-container {
            padding: 10px;
        }

        .chat-list-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.3s var(--spring-easing);
            border-bottom: 1px solid hsla(210, 40%, 94%, 0.5);
            animation: slideUp 0.4s var(--spring-easing) backwards;
            background: white;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .chat-list-item:hover {
            background: hsl(210, 40%, 96%);
            transform: translateX(8px);
        }

        .chat-view-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-main);
        }

        .chat-header {
            padding: 16px 20px;
            background: var(--bg-nav);
            backdrop-filter: var(--glass-blur);
            display: flex;
            align-items: center;
            gap: 12px;

        };

        // Initialize Firebase
        const appInstance = initializeApp(firebaseConfig);
        const auth = getAuth(appInstance);

        // --- UTILITIES ---
        const utils = {
            // --- Toast Notification ---
            showToast: (msg, type = 'info') => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.style.background = type === 'error' ? 'var(--accent)' : 'var(--text-dark)';
                toast.style.color = 'white';
                toast.style.padding = '12px 24px';
                toast.style.borderRadius = '16px';
                toast.style.boxShadow = '0 10px 30px rgba(0,0,0,0.2)';
                toast.style.fontSize = '0.9rem';
                toast.style.fontWeight = '500';
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px) scale(0.9)';
                toast.style.transition = 'all 0.4s var(--spring-easing)';
                toast.style.display = 'flex';
                toast.style.alignItems = 'center';
                toast.style.gap = '10px';
                toast.innerHTML = type === 'success' ? `<i class="fas fa-check-circle" style="color: #4ade80;"></i> ${msg}` : msg;

                container.appendChild(toast);

                // Animate In
                requestAnimationFrame(() => {
                    toast.style.opacity = '1';
                    toast.style.transform = 'translateY(0) scale(1)';
                });

                // Remove
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px) scale(0.9)';
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            },

            // Compress and Resize Image to Base64
            processImage: (file, maxWidth = 1080, quality = 0.8) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const elem = document.createElement('canvas');
                            const scaleFactor = Math.min(1, maxWidth / img.width);
                            elem.width = img.width * scaleFactor;
                            elem.height = img.height * scaleFactor;
                            const ctx = elem.getContext('2d');
                            ctx.drawImage(img, 0, 0, elem.width, elem.height);
                            resolve(elem.toDataURL('image/jpeg', quality));
                        };
                    };
                    reader.onerror = error => reject(error);
                });
            },
            timeAgo: (timestamp) => {
                if (!timestamp) return '';
                const seconds = Math.floor((new Date() - new Date(timestamp)) / 1000);
                let interval = seconds / 31536000;
                if (interval > 1) return Math.floor(interval) + "y";
                interval = seconds / 2592000;
                if (interval > 1) return Math.floor(interval) + "mo";
                interval = seconds / 86400;
                if (interval > 1) return Math.floor(interval) + "d";
                interval = seconds / 3600;
                if (interval > 1) return Math.floor(interval) + "h";
                interval = seconds / 60;
                if (interval > 1) return Math.floor(interval) + "m";
                return Math.floor(seconds) + "s";
            },
            generateId: () => Date.now().toString(36) + Math.random().toString(36).substr(2),
            animateCount: (element, start, end, duration = 1000) => {
                if (!element) return;
                let startTime = null;
                const animate = (currentTime) => {
                    if (!startTime) startTime = currentTime;
                    const progress = Math.min((currentTime - startTime) / duration, 1);
                    const currentVal = Math.floor(progress * (end - start) + start);
                    element.innerText = currentVal;
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        element.innerText = end;
                    }
                };
                requestAnimationFrame(animate);
            }
        };

                // Update Nav Logic

                if (viewName === 'profile') app.loadProfile(data);
                if (viewName === 'activity') app.loadActivity();
                if (viewName === 'chat') app.loadChatList();
            }
        };

        const app = {
            init: () => {
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        state.user = user;
                        document.getElementById('auth-view').classList.add('hidden');
                        document.getElementById('app-view').classList.remove('hidden');
                        app.loadUserData();
                        viewManager.render('home');
                    } else {
                        state.user = null;
                        document.getElementById('auth-view').classList.remove('hidden');
                        document.getElementById('app-view').classList.add('hidden');
                    }
                });

                window.addEventListener('online', () => {
                    document.getElementById('offline-banner').style.display = 'none';
                    document.body.classList.remove('is-offline');
                });
                window.addEventListener('offline', () => {
                    document.getElementById('offline-banner').style.display = 'block';
                    document.body.classList.add('is-offline');
                });

                const searchInp = document.getElementById('global-search');
                if (searchInp) {
                    searchInp.oninput = (e) => app.searchUsers(e.target.value);
                }

                // Initial Offline Check
                if (!navigator.onLine) {
                    document.getElementById('offline-banner').style.display = 'block';
                    document.body.classList.add('is-offline');
                }
                document.addEventListener('click', (e) => {
                    const results = document.getElementById('search-results');
                    if (results && !e.target.closest('#search-results') && !e.target.closest('#global-search')) {
                        results.style.display = 'none';
                    }
                });

                // --- Pull to Refresh Gesture ---
                let startY = 0;
                let pullDelta = 0;
                const ptrIndicator = document.getElementById('ptr-indicator');
                const main = document.getElementById('main-content');

                main.addEventListener('touchstart', (e) => {
                    const viewName = viewManager.currentView;
                    if (viewName !== 'home' || main.scrollTop > 5) return;
                    startY = e.touches[0].pageY;
                    ptrIndicator.classList.add('pulling');
                    ptrIndicator.classList.remove('refreshing');
                }, { passive: true });

                main.addEventListener('touchmove', (e) => {
                    const viewName = viewManager.currentView;
                    if (viewName !== 'home' || main.scrollTop > 5) return;
                    const y = e.touches[0].pageY;
                    pullDelta = Math.max(0, (y - startY) * 0.5); // Resistance

                    if (pullDelta > 0) {
                        ptrIndicator.style.transform = `translateY(${Math.min(pullDelta - 60, 0)}px)`;
                        const icon = ptrIndicator.querySelector('.ptr-icon');
                        if (icon) {
                            icon.style.transform = `rotate(${Math.min(pullDelta * 3, 180)}deg)`;
                        }
                    }
                }, { passive: true });

                main.addEventListener('touchend', async () => {
                    ptrIndicator.classList.remove('pulling');
                    if (pullDelta > 60) {
                        ptrIndicator.classList.add('refreshing');
                        const icon = ptrIndicator.querySelector('.ptr-icon');
                        if (icon) icon.className = 'fas fa-sync-alt refresh-spin';

                        // Trigger Refresh
                        await app.loadHome(true);

                        // Reset
                        setTimeout(() => {
                            ptrIndicator.classList.remove('refreshing');
                            ptrIndicator.style.transform = '';
                            if (icon) {
                                icon.className = 'fas fa-arrow-down ptr-icon';
                                icon.style.transform = '';
                            }
                        }, 500);
                    } else {
                        ptrIndicator.style.transform = '';
                    }
                    pullDelta = 0;
                });
            },

            toggleDarkMode: () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');

                // Update toggle button icon if exists
                const btn = document.getElementById('theme-toggle-btn');
                if (btn) btn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            },

            loadUserData: async () => {
                const uid = state.user.uid;

                // --- Theme Logic ---
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') {
                    document.body.classList.add('dark-mode');
                }

                // --- Presence Logic ---
                const connectedRef = ref(db, '.info/connected');
                const presenceRef = ref(db, `presence/${uid}`);
                onValue(connectedRef, (snap) => {
                    if (snap.val() === true) {
                        onDisconnect(presenceRef).set({ online: false, lastSeen: serverTimestamp() });
                        set(presenceRef, { online: true });
                    }
                });

                // Sync profile data
                onValue(ref(db, `users/${uid}`), (snap) => {
                    if (snap.exists()) {
                        const dbUser = snap.val();
                        const photo = dbUser.photo || dbUser.photoURL || `https://ui-avatars.com/api/?name=${dbUser.username || 'User'}&background=random`;
                        const username = dbUser.username || "User";

                        state.user.photoURL = photo;
                        state.user.displayName = username;

                        // Real-time Global Sync
                        app.updateGlobalAvatars(uid, photo);
                        app.updateGlobalUsernames(uid, username);
                    }
                });
                onValue(ref(db, `following/${uid}`), (snap) => {
                    state.following = snap.val() ? Object.keys(snap.val()) : [];
                });
                onValue(ref(db, `blocked/${uid}`), (snap) => {
                    state.blocked = snap.val() ? Object.keys(snap.val()) : [];
                });
            },

            updateGlobalAvatars: (uid, photoURL) => {
                document.querySelectorAll(`.avatar-sync[data-uid="${uid}"]`).forEach(img => {
                    img.src = photoURL;
                });
            },

            updateGlobalUsernames: (uid, username) => {
                document.querySelectorAll(`.username-sync[data-uid="${uid}"]`).forEach(el => {
                    el.innerText = username;
                });
            },

            navTo: (view, data = null) => viewManager.render(view, data),

            handleAuth: async () => {
                const email = document.getElementById('auth-email').value;
                const password = document.getElementById('auth-password').value;
                const msg = document.getElementById('auth-msg');
                msg.textContent = "Processing...";
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                        try {
                            const cred = await createUserWithEmailAndPassword(auth, email, password);
                            await set(ref(db, 'users/' + cred.user.uid), {
                                username: email.split('@')[0],
                                email: email,
                                photoURL: "https://via.placeholder.com/150",
                                createdAt: serverTimestamp()
                            });
                        } catch (createErr) { msg.textContent = createErr.message; }
                    } else { msg.textContent = error.message; }
                }
            },

            handleGoogleAuth: async () => {
                const provider = new GoogleAuthProvider();
                try {
                    const result = await signInWithPopup(auth, provider);
                    const userRef = ref(db, 'users/' + result.user.uid);
                    get(userRef).then((snap) => {
                        if (!snap.exists()) {
                            set(userRef, {
                                username: result.user.displayName,
                                email: result.user.email,
                                photoURL: result.user.photoURL,
                                createdAt: serverTimestamp()
                            });
                        }
                    });
                } catch (error) { document.getElementById('auth-msg').textContent = error.message; }
            },

            searchUsers: (queryStr) => {
                const resDiv = document.getElementById('search-results');
                if (!queryStr || queryStr.length < 2) {
                    resDiv.style.display = 'none';
                    return;
                }
                get(ref(db, 'users')).then(snap => {
                    const users = snap.val();
                    if (!users) return;
                    const filtered = Object.entries(users).filter(([uid, data]) => {
                        return data.username.toLowerCase().includes(queryStr.toLowerCase()) && uid !== state.user.uid;
                    });
                    resDiv.innerHTML = "";
                    if (filtered.length > 0) {
                        resDiv.style.display = 'block';
                        filtered.forEach(([uid, data]) => {
                            const photo = data.photoURL || data.photo || `https://ui-avatars.com/api/?name=${data.username}&background=random`;
                            const div = document.createElement('div');
                            div.className = 'search-item';
                            div.innerHTML = `<img src="${photo}" class="avatar-sync" data-uid="${uid}">
                                <div><div class="username username-sync" data-uid="${uid}">${data.username}</div><div style="font-size: 0.7rem; color: gray;">View Profile</div></div>`;
                            div.onclick = () => { app.navTo('profile', uid); resDiv.style.display = 'none'; };
                            resDiv.appendChild(div);
                        });
                    } else { resDiv.style.display = 'none'; }
                });
            },

            showEditUsername: () => {
                const modal = document.createElement('div');
                modal.className = 'edit-modal';
                modal.innerHTML = `<div class="edit-card"><h3>Edit Username</h3>
                    <div class="input-group" style="margin-top: 15px;"><input type="text" id="new-username" value="${state.user.displayName || ''}"></div>
                    <div style="display: flex; gap: 10px; margin-top: 20px;"><button class="btn btn-primary" onclick="app.updateUsername()">Save</button>
                    <button class="btn" style="flex:1; background: #e2e8f0; border-radius: 12px;" onclick="this.closest('.edit-modal').remove()">Cancel</button></div></div>`;
                document.body.appendChild(modal);
            },

            updateUsername: async () => {
                const newName = document.getElementById('new-username').value;
                if (!newName.trim()) return;
                try {
                    await updateProfile(auth.currentUser, { displayName: newName });
                    await update(ref(db, `users/${state.user.uid}`), { username: newName });
                    document.getElementById('profile-username').innerText = newName;
                    document.querySelector('.edit-modal').remove();
                    alert("Username updated!");
                } catch (err) { alert("Error: " + err.message); }
            },

            logout: () => signOut(auth),

            loadHome: (isRefresh = false) => {
                const container = document.getElementById('feed-container');
                if (!isRefresh) {
                    container.innerHTML = `
                        <div class="skeleton sk-card"></div>
                        <div class="skeleton sk-card"></div>
                        <div class="skeleton sk-card"></div>
                    `;
                }

                // Offline Logic: Load from Cache
                if (!navigator.onLine) {
                    const cached = localStorage.getItem('cached_posts');
                    if (cached) {
                        const posts = JSON.parse(cached);
                        container.innerHTML = "";
                        posts.forEach(post => { if (!state.blocked.includes(post.uid)) container.innerHTML += app.renderPostCard(post); });
                        app.updateGlobalAvatars(state.user.uid, state.user.photoURL);
                        app.updateGlobalUsernames(state.user.uid, state.user.displayName);
                        return;
                    }
                }

                onValue(query(ref(db, 'posts'), limitToLast(20)), (snapshot) => {
                    const data = snapshot.val();
                    if (!data) {
                        container.innerHTML = `
                            <div class="empty-state" style="text-align: center; padding: 60px 20px; animation: slideUp 0.6s var(--spring-easing);">
                                <div style="width: 120px; height: 120px; background: var(--primary-light); border-radius: 40px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; color: var(--primary);">
                                    <i class="fas fa-camera-retro" style="font-size: 3.5rem;"></i>
                                </div>
                                <h3 style="font-weight: 800; font-size: 1.5rem; margin-bottom: 8px;">No stories yet!</h3>
                                <p style="color: var(--text-gray); font-size: 0.95rem;">Tap the + to be the first to share a moment today.</p>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = "";
                    let posts = Object.entries(data).map(([key, val]) => ({ id: key, ...val }));
                    posts.sort((a, b) => b.timestamp - a.timestamp);

                    // Cache the successful fetch
                    localStorage.setItem('cached_posts', JSON.stringify(posts));

                    posts.forEach((post, index) => {
                        if (!state.blocked.includes(post.uid)) {
                            container.innerHTML += app.renderPostCard(post);
                        }
                    });

                    app.updateGlobalAvatars(state.user.uid, state.user.photoURL);
                    app.updateGlobalUsernames(state.user.uid, state.user.displayName);
                    app.loadStories();
                }, { onlyOnce: true });
            },

            loadStories: () => {
                const rail = document.getElementById('stories-rail');
                onValue(ref(db, 'stories'), (snap) => {
                    const items = rail.querySelectorAll('.story-item');
                    items.forEach((item, index) => { if (index > 0) item.remove(); });
                    const stories = snap.val();
                    if (!stories) return;
                    const seen = new Set();
                    Object.values(stories).reverse().forEach(story => {
                        if (seen.has(story.uid)) return;
                        seen.add(story.uid);
                        const isOwn = story.uid === state.user.uid;
                        const userPhoto = isOwn ? (state.user.photoURL || story.userPhoto) : story.userPhoto;
                        const photo = userPhoto || `https://ui-avatars.com/api/?name=${story.username}&background=random`;
                        const div = document.createElement('div');
                        div.className = 'story-item';
                        div.innerHTML = `<div class="story-ring"><img src="${photo}" class="avatar-sync" data-uid="${story.uid}"></div><div class="story-name username-sync" data-uid="${story.uid}">${story.username}</div>`;
                        div.onclick = () => app.viewStory(story);
                        rail.appendChild(div);
                    });
                });
            },

            addStory: () => {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = 'image/*';
                input.onchange = async (e) => {
                    if (e.target.files[0]) {
                        const b64 = await utils.processImage(e.target.files[0], 1080, 0.8);
                        await set(ref(db, `stories/${utils.generateId()}`), {
                            uid: state.user.uid,
                            username: state.user.displayName || "User",
                            userPhoto: state.user.photoURL || `https://ui-avatars.com/api/?name=${state.user.displayName}&background=random`,
                            image: b64,
                            timestamp: serverTimestamp()
                        });
                        alert("Story added!");
                    }
                };
                input.click();
            },

            viewStory: (story) => {
                const modal = document.createElement('div');
                modal.className = 'modal';
                const isOwner = story.uid === state.user.uid;
                const userPhoto = isOwner ? (state.user.photoURL || story.userPhoto) : story.userPhoto;
                const photo = userPhoto || `https://ui-avatars.com/api/?name=${story.username}&background=random`;
                modal.innerHTML = `<div class="story-view-content" style="height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; background: black;">
                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.3); z-index: 300;">
                        <div id="story-progress" style="height: 100%; width: 0%; background: white; transition: width 0.1s linear;"></div>
                    </div>
                    <img src="${story.image}" style="max-height: 100%; max-width: 100%; object-fit: contain;">
                    <div style="position:absolute; top:30px; left:20px; color:white; display:flex; gap:10px; align-items:center;">
                        <img src="${photo}" class="avatar-sync" data-uid="${story.uid}" style="width:40px; height:40px; border-radius:50%; border: 2px solid white;"><span class="username-sync" data-uid="${story.uid}">${story.username}</span>
                    </div>
                    <i class="fas fa-times" style="position:absolute; top:30px; right:20px; color:white; font-size:1.8rem; cursor:pointer;" id="close-story"></i>
                    ${isOwner ? `<div class="story-views-btn" id="view-list-btn"><i class="fas fa-eye"></i> Viewers</div>` : ''}
                </div>`;
                document.body.appendChild(modal);

                // Track View
                if (!isOwner) {
                    set(ref(db, `story_views/${story.id}/${state.user.uid}`), {
                        username: state.user.displayName || "User",
                        photoURL: state.user.photoURL || `https://ui-avatars.com/api/?name=${state.user.displayName}&background=random`,
                        timestamp: serverTimestamp()
                    });
                }

                if (isOwner) {
                    document.getElementById('view-list-btn').onclick = () => {
                        app.showStoryViews(story.id);
                        clearInterval(interval);
                        modal.remove();
                    };
                }

                document.getElementById('close-story').onclick = () => { clearInterval(interval); modal.remove(); };

                let progress = 0;
                const interval = setInterval(() => {
                    progress += 2;
                    const progEl = document.getElementById('story-progress');
                    if (progEl) progEl.style.width = progress + '%';
                    if (progress >= 100) { clearInterval(interval); modal.remove(); }
                }, 100);
            },

            showStoryViews: async (storyId) => {
                const snap = await get(ref(db, `story_views/${storyId}`));
                const modal = document.createElement('div');
                modal.className = 'views-modal';
                let usersHtml = "";
                if (snap.exists()) {
                    Object.values(snap.val()).forEach(u => {
                        const photo = u.photoURL || `https://ui-avatars.com/api/?name=${u.username}&background=random`;
                        usersHtml += `<div class="view-user-row">
                            <img src="${photo}" class="avatar-sync" data-uid="${u.uid || ''}">
                            <div>
                                <div class="username-sync" data-uid="${u.uid || ''}" style="font-weight:600;">${u.username}</div>
                                <div style="font-size:0.7rem; color:gray;">${utils.timeAgo(u.timestamp)}</div>
                            </div>
                        </div>`;
                    });
                } else {
                    usersHtml = "<p style='text-align:center; padding:20px;'>No views yet.</p>";
                }

                modal.innerHTML = `<div class="views-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h3 style="margin:0;">Story Views</h3>
                        <i class="fas fa-times" style="cursor:pointer;" onclick="this.closest('.views-modal').remove()"></i>
                    </div>
                    ${usersHtml}
                </div>`;
                document.body.appendChild(modal);
            },

            showLikers: async (postId) => {
                const snap = await get(ref(db, `posts/${postId}/likes`));
                const modal = document.createElement('div');
                modal.className = 'views-modal';
                let usersHtml = "";

                if (snap.exists()) {
                    const uids = Object.keys(snap.val());
                    for (const uid of uids) {
                        const userSnap = await get(ref(db, `users/${uid}`));
                        if (userSnap.exists()) {
                            const u = userSnap.val();
                            const photo = u.photoURL || u.photo || `https://ui-avatars.com/api/?name=${u.username}&background=random`;
                            usersHtml += `<div class="view-user-row" onclick="app.navTo('profile', '${uid}'); this.closest('.views-modal').remove()" style="cursor:pointer;">
                                <img src="${photo}" class="avatar-sync" data-uid="${uid}">
                                <div>
                                    <div class="username-sync" data-uid="${uid}" style="font-weight:600;">${u.username}</div>
                                    <div style="font-size:0.7rem; color:gray;">View Profile</div>
                                </div>
                            </div>`;
                        }
                    }
                } else {
                    usersHtml = "<p style='text-align:center; padding:20px;'>No likes yet.</p>";
                }

                modal.innerHTML = `<div class="views-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h3 style="margin:0;">Likes</h3>
                        <i class="fas fa-times" style="cursor:pointer;" onclick="this.closest('.views-modal').remove()"></i>
                    </div>
                    ${usersHtml}
                </div>`;
                document.body.appendChild(modal);
            },

            renderPostCard: (post) => {
                const liked = post.likes && post.likes[state.user.uid];
                const isOwn = post.uid === state.user.uid;
                const isFollowing = state.following.includes(post.uid);
                const userPhoto = isOwn ? (state.user.photoURL || post.userPhoto) : post.userPhoto;
                const username = isOwn ? (state.user.displayName || post.username) : post.username;

                setTimeout(() => app.loadComments(post.id), 100);
                return `<div class="card" id="post-${post.id}">
                    <div class="card-header">
                        <div class="user-info" onclick="app.navTo('profile', '${post.uid}')" style="cursor:pointer;">
                            <img src="${userPhoto}" class="user-avatar-sm avatar-sync" data-uid="${post.uid}">
                            <div>
                                <div class="username username-sync" data-uid="${post.uid}">${username}</div>
                                <div class="post-time">${utils.timeAgo(post.timestamp)}</div>
                            </div>
                        </div>
                        ${!isOwn ? `<button class="btn follow-btn-sync" data-uid="${post.uid}" style="color:var(--primary-yellow); font-size:0.8rem; font-weight:600;" onclick="event.stopPropagation(); app.toggleFollow('${post.uid}', '${post.username}')">
                            ${isFollowing ? 'Following' : 'Follow'}
                        </button>` : ''}
                    </div>
                    <div class="card-image-container"><img src="${post.image}" class="card-img" ondblclick="app.likePost('${post.id}', '${post.uid}')"><div class="like-overlay"><i class="fas fa-heart"></i></div></div>
                    <div class="card-actions"><div class="action-left">
                        <button class="action-btn ${liked ? 'liked' : ''}" onclick="app.likePost('${post.id}', '${post.uid}')"><i class="${liked ? 'fas' : 'far'} fa-heart"></i></button>
                        <button class="action-btn" onclick="document.getElementById('comment-input-${post.id}').focus()"><i class="far fa-comment"></i></button>
                        <button class="action-btn" onclick="app.showReactions('${post.id}')"><i class="far fa-smile"></i></button></div>
                        <button class="action-btn" onclick="app.savePost('${post.id}')"><i class="far fa-bookmark"></i></button></div>
                    <div class="card-content"><span class="likes-count" style="cursor:pointer;" onclick="app.showLikers('${post.id}')">${post.likeCount || 0} likes</span>
                        <div class="caption"><span class="username username-sync" data-uid="${post.uid}" onclick="app.navTo('profile', '${post.uid}')" style="cursor:pointer;">${post.username}</span> ${post.caption}</div>
                        <div class="comments-section"><div id="comments-list-${post.id}"></div>
                        <div class="comment-input-row"><input type="text" id="comment-input-${post.id}" placeholder="Add a comment...">
                        <button class="comment-btn" onclick="app.addComment('${post.id}', '${post.uid}')"><i class="fas fa-paper-plane"></i></button></div></div></div></div>`;
            },

            likePost: async (postId, authorId) => {
                const uid = state.user.uid;
                const postRef = ref(db, `posts/${postId}`);
                const card = document.getElementById(`post-${postId}`);

                const snap = await get(postRef);
                if (snap.exists()) {
                    const post = snap.val();
                    let likes = post.likes || {};
                    let count = post.likeCount || 0;

                    if (likes[uid]) {
                        // Unlike
                        delete likes[uid];
                        count = Math.max(0, count - 1);
                        if (card) {
                            const btn = card.querySelector('.action-btn i.fa-heart');
                            btn.className = 'far fa-heart'; btn.parentElement.classList.remove('liked');
                        }
                    } else {
                        // Like
                        likes[uid] = true;
                        count++;
                        if (card) {
                            const overlay = card.querySelector('.like-overlay');
                            overlay.classList.add('like-anim'); setTimeout(() => overlay.classList.remove('like-anim'), 800);
                            const btn = card.querySelector('.action-btn i.fa-heart');
                            btn.className = 'fas fa-heart'; btn.parentElement.classList.add('liked');
                        }
                        if (uid !== authorId) push(ref(db, `notifications/${authorId}`), { type: 'like', from: uid, postId, timestamp: serverTimestamp(), read: false });
                    }
                    update(postRef, { likes, likeCount: count });
                }
            },

            addComment: async (postId, authorId) => {
                const inp = document.getElementById(`comment-input-${postId}`);
                if (!inp.value.trim()) return;
                await push(ref(db, `comments/${postId}`), { uid: state.user.uid, username: state.user.displayName || "User", text: inp.value, timestamp: serverTimestamp() });
                if (state.user.uid !== authorId) push(ref(db, `notifications/${authorId}`), { type: 'comment', from: state.user.uid, fromName: state.user.displayName, postId, timestamp: serverTimestamp(), read: false });
                inp.value = "";
            },

            loadComments: (postId) => {
                const list = document.getElementById(`comments-list-${postId}`);
                if (!list) return;
                onValue(query(ref(db, `comments/${postId}`), limitToLast(3)), (snap) => {
                    list.innerHTML = "";
                    const data = snap.val();
                    if (data) Object.values(data).forEach(c => {
                        const div = document.createElement('div');
                        div.className = 'comment-item';
                        div.innerHTML = `<span class="comment-user">${c.username}</span> ${c.text}`;
                        list.appendChild(div);
                    });
                });
            },

            savePost: async (postId) => {
                const saveRef = ref(db, `saved/${state.user.uid}/${postId}`);
                const snap = await get(saveRef);
                if (snap.exists()) {
                    await set(saveRef, null);
                    alert("Post Unsaved 🗑️");
                } else {
                    await set(saveRef, true);

            },

            showReactions: (postId) => {

                ['🔥', '😂', '😢', '😮', '😍'].forEach(e => {

            publishPost: async () => {

                if (!fileInput.files[0]) return;
                status.textContent = "Uploading...";
                const b64 = await utils.processImage(fileInput.files[0], 1080, 0.8);

                const statFollowers = document.getElementById('stat-followers');
                const statFollowing = document.getElementById('stat-following');

                if (statFollowers) statFollowers.innerText = "0";
                if (statFollowing) statFollowing.innerText = "0";

                window.profileUnsubscribe = onValue(ref(db, `users/${uid}`), (userSnap) => {
                    const userData = userSnap.val() || {};
                    const username = userData.username || "User";
                    const photo = userData.photo || userData.photoURL || `https://ui-avatars.com/api/?name=${username}&background=random`;

                    if (profileImg) {
                        profileImg.src = photo;
                        profileImg.classList.add('avatar-sync');
                        profileImg.setAttribute('data-uid', uid);
                    }

                    if (profileUserEl) {
                        profileUserEl.innerText = username;
                        profileUserEl.classList.add('username-sync');
                        profileUserEl.setAttribute('data-uid', uid);
                    }

                    const profileEmailEl = document.getElementById('profile-email');
                    if (profileEmailEl) profileEmailEl.innerText = userData.email || "";

                    const editBtn = document.getElementById('edit-username-btn');
                    const logoutBtn = document.getElementById('logout-btn');
                    const profileImgOverlay = document.querySelector('.profile-img-overlay');
                    const actionsDiv = document.getElementById('profile-actions');

                    if (!actionsDiv) return;

                    if (isOwn) {
                        if (editBtn) editBtn.classList.remove('hidden');
                        if (logoutBtn) logoutBtn.classList.remove('hidden');
                        const changePhotoBtn = document.getElementById('change-photo-btn');
                        if (changePhotoBtn) {
                            changePhotoBtn.classList.remove('hidden');
                            changePhotoBtn.onclick = () => document.getElementById('profile-file').click();
                        }
